project:
  name: Aquarium Engine
  root: E:\Projects\Aquarium-Engine
  upstream: https://github.com/GameCult/Aquarium-Engine
  purpose: >
    Native C# runtime and renderer core for Aquarium clients. The engine owns
    the Win32 host, D3D12 renderer, input loop, client reload boundary, debug UI,
    audio host, persistent-state transport, and future render graph
    abstractions. Epiphany is the current first-party client: it owns frontend
    intent, agent visuals, CultCache/CultNet semantics, and render-plan
    configuration through the engine contracts.

