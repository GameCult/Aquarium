project:
  name: Epiphany Aquarium
  root: E:\Projects\Aquarium-Engine
  upstream: https://github.com/GameCult/Aquarium-Engine
  purpose: >
    Epiphany-owned Aquarium client for the adjacent Fensalir native runtime.
    This repo owns agent visuals, client state, CultNet/CultCache semantics,
    voice surfaces, camera intent, and Epiphany-specific render-plan policy.

current_model:
  runtime:
    implementation: src/Aquarium.Epiphany
    project: src/Aquarium.Epiphany/Aquarium.Epiphany.csproj
    render_plan: src/Aquarium.Epiphany/EpiphanyRenderPlan.cs
    scene_builder: src/Aquarium.Epiphany/EpiphanySceneBuilder.cs
    shaders: src/Aquarium.Epiphany/Shaders
    state_store: src/Aquarium.Epiphany/State/AquariumCultStateStore.cs
    voice: src/Aquarium.Epiphany/Voice
    world: src/Aquarium.Epiphany/World
  preview:
    implementation: src/Aquarium.Epiphany.AgentPreview
    purpose: isolated Epiphany agent-body preview through the Fensalir renderer
  engine_dependency:
    root: E:\Projects\Fensalir
    contracts: E:\Projects\Fensalir\src\Aquarium.Engine.Contracts
    host: E:\Projects\Fensalir\src\Aquarium.Engine
    scripts: E:\Projects\Fensalir\scripts
  solution: EpiphanyAquarium.sln

invariants:
  - The client may reference Fensalir contracts and host tools; Fensalir must not reference Epiphany.
  - Epiphany owns agent role semantics, body state, camera intent, CultCache documents, and CultNet interpretation.
  - Renderer implementation, D3D12 plumbing, hot reload, host lifecycle, reusable fractal machinery, and engine demos live in Fensalir.
  - Client shaders stay in this repo because they express Epiphany bodies and materials.
  - Missing engine authority should be added in Fensalir before being consumed here.

next_actions:
  - Keep `dotnet build EpiphanyAquarium.sln` green against the adjacent Fensalir source dependency.
  - Keep wrapper scripts thin; do not copy Fensalir host scripts back into this repo.
  - Move any remaining engine-only documentation or state to `E:\Projects\Fensalir` when found.
  - When Fensalir has packages, replace sibling source references with deliberate package references.
